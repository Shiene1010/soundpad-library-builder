<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111315">
    <title>Sound Chunk Library Builder</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">User App</p>
          <h1>Sound Chunk</h1>
        </div>
        <span id="user-status" class="pill">승인 대기</span>
      </header>

      <section class="panel hero">
        <h2>새 표현을 받고 필요한 문장을 요청합니다.</h2>
        <p>내게 열린 기능만 표시됩니다.</p>
      </section>
      <section id="state-panel" class="panel state-panel">
        <strong id="state-title">계정 확인 중</strong>
        <p id="state-copy">로그인 상태와 승인 권한을 확인하고 있습니다.</p>
      </section>

      <nav class="tabs" aria-label="주요 메뉴">
        <button id="tab-library" class="tab is-active" data-view="library" type="button">라이브러리</button>
        <button id="tab-requests" class="tab" data-view="requests" type="button">요청</button>
        <button id="tab-feedback" class="tab" data-view="feedback" type="button">피드백</button>
        <button id="tab-settings" class="tab" data-view="settings" type="button">설정</button>
      </nav>

      <section id="view-library" class="view">
        <div class="section-head">
          <h2>최신 라이브러리</h2>
          <button id="check-updates" class="text-button" type="button">업데이트 확인</button>
        </div>
        <div id="library-list" class="stack"></div>
      </section>

      <section id="view-requests" class="view hidden">
        <div class="section-head">
          <h2>표현 요청</h2>
          <span id="request-permission" class="muted">확인 중</span>
        </div>
        <form id="request-form" class="panel form">
          <label>
            익히고 싶은 표현
            <input id="request-text" name="text" autocomplete="off" placeholder="I'm running late" required>
          </label>
          <label>
            쓰고 싶은 상황
            <textarea id="request-context" name="context" rows="3" placeholder="약속에 늦을 때 쓰고 싶어요"></textarea>
          </label>
          <button class="primary" type="submit">요청하기</button>
        </form>
      </section>

      <section id="view-feedback" class="view hidden">
        <div class="section-head">
          <h2>사용 후기</h2>
          <span class="muted">후기</span>
        </div>
        <form id="feedback-form" class="panel form">
          <label>
            제목
            <input id="feedback-title" name="title" autocomplete="off" placeholder="라이브러리 다운로드가 편했어요" required>
          </label>
          <label>
            내용
            <textarea id="feedback-body" name="body" rows="5" placeholder="좋았던 점, 불편한 점, 필요한 표현을 적어주세요." required></textarea>
          </label>
          <button class="primary" type="submit">피드백 올리기</button>
        </form>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="section-head">
          <h2>설정</h2>
        </div>
        <div class="panel setting-row">
          <div>
            <strong>새 버전 알림</strong>
            <p>접속할 때 업데이트를 확인합니다.</p>
          </div>
          <label class="switch">
            <input id="notify-toggle" type="checkbox">
            <span></span>
          </label>
        </div>
        <div id="request-permission-panel" class="panel">
          <strong>표현 요청</strong>
          <p id="request-setting-text">운영자가 허용한 사용자만 요청 기능을 쓸 수 있습니다.</p>
        </div>
        <div class="panel">
          <strong>현재 계정</strong>
          <p id="account-summary">계정 확인 중</p>
          <button id="switch-account" class="secondary" type="button">로그아웃 / 계정 전환</button>
        </div>
        <div id="user-admin" class="panel hidden">
          <div class="compact-head">
            <strong>사용자</strong>
            <button id="refresh-users" class="text-button" type="button">새로고침</button>
          </div>
          <div id="user-list" class="stack"></div>
        </div>
        <div id="operator-queue-head" class="compact-head hidden">
          <strong id="request-queue-title">요청 큐</strong>
          <div class="button-pair">
            <button id="refresh-requests" class="text-button" type="button">새로고침</button>
            <button id="export-library" class="text-button" type="button">내보내기</button>
            <button id="publish-library" class="text-button" type="button">배포</button>
            <button id="clear-requests" class="text-button" type="button">비우기</button>
          </div>
        </div>
        <div id="request-list" class="stack hidden"></div>
        <pre id="export-preview" class="draft-preview hidden"></pre>
        <pre id="manifest-preview" class="draft-preview hidden"></pre>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="./app.js?v=20261108-readability-pass" type="module"></script>
  </body>
</html>
