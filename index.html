<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111315">
    <title>Sound Chunk Library Builder</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operator Console</p>
          <h1>Sound Chunk</h1>
        </div>
        <span id="user-status" class="pill">승인 대기</span>
      </header>

      <section class="panel hero">
        <h2>표현을 라이브러리로 만들고 사용자에게 알립니다.</h2>
        <p>운영자는 표현을 검수하고, Gemini 초안을 확인한 뒤, GitHub libraries 폴더로 배포합니다.</p>
      </section>

      <nav class="tabs" aria-label="주요 메뉴">
        <button class="tab is-active" data-view="library" type="button">라이브러리</button>
        <button class="tab" data-view="requests" type="button">요청</button>
        <button class="tab" data-view="feedback" type="button">피드백</button>
        <button class="tab" data-view="settings" type="button">설정</button>
      </nav>

      <section id="view-library" class="view">
        <div class="section-head">
          <h2>최신 라이브러리</h2>
          <button id="check-updates" class="text-button" type="button">업데이트 확인</button>
        </div>
        <div id="library-list" class="stack"></div>
      </section>

      <section id="view-requests" class="view hidden">
        <div class="section-head">
          <h2>표현 요청</h2>
          <span id="request-permission" class="muted">권한 확인 중</span>
        </div>
        <form id="request-form" class="panel form">
          <label>
            익히고 싶은 표현
            <input id="request-text" name="text" autocomplete="off" placeholder="I'm running late" required>
          </label>
          <label>
            쓰고 싶은 상황
            <textarea id="request-context" name="context" rows="3" placeholder="약속에 늦을 때 쓰고 싶어요"></textarea>
          </label>
          <button class="primary" type="submit">운영자에게 요청</button>
        </form>
      </section>

      <section id="view-feedback" class="view hidden">
        <div class="section-head">
          <h2>사용 후기</h2>
          <span class="muted">GitHub Discussions</span>
        </div>
        <form id="feedback-form" class="panel form">
          <label>
            제목
            <input id="feedback-title" name="title" autocomplete="off" placeholder="라이브러리 다운로드가 편했어요" required>
          </label>
          <label>
            내용
            <textarea id="feedback-body" name="body" rows="5" placeholder="좋았던 점, 불편한 점, 필요한 표현을 적어주세요." required></textarea>
          </label>
          <button class="primary" type="submit">피드백 올리기</button>
        </form>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="section-head">
          <h2>사용자 설정</h2>
        </div>
        <div class="panel setting-row">
          <div>
            <strong>새 라이브러리 알림</strong>
            <p>접속 시 최신 manifest를 확인하고 배너를 표시합니다.</p>
          </div>
          <label class="switch">
            <input id="notify-toggle" type="checkbox">
            <span></span>
          </label>
        </div>
        <div class="panel">
          <strong>표현 요청 권한</strong>
          <p id="request-setting-text">운영자가 허용한 사용자만 요청 기능을 쓸 수 있습니다.</p>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
